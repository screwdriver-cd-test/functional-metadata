shared:
    image: node:22
    steps:
        - echo: echo "test"

jobs:
    hub:
        requires: [ ~commit, ~pr ]
        annotations:
            screwdriver.cd/virtualJob: true

    a:
        requires: [ ~hub ]
        steps:
            - set: meta set foo.bar "success"

    b:
        requires: [ ~hub ]
        steps:
            - set: meta set foo.baz "success"
            - wait: sleep 10

    c:
        requires: [ ~hub ]
        steps:
            - set: meta set foo.bar "error"
            - wait: sleep 20

    d:
        requires: [ ~hub ]
        steps:
            - set: meta set foo.baz "error"
            - wait: sleep 20

    virtual:
        requires: [ a, b ]
        annotations:
            screwdriver.cd/virtualJob: true

    target:
        requires: [ ~virtual ]
        blockedBy: [ ~c, ~d ]
        steps:
            - print: meta get "foo"
            - check_meta: |
                  test "success" = `meta get "foo.bar"`
                  test "success" = `meta get "foo.baz"`
