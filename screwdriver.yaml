shared:
    image: node:22
    steps:
        - echo: echo "test"

jobs:
    hub:
        requires: [ ~commit, ~pr ]
        annotations:
            screwdriver.cd/virtualJob: true

    a:
        requires: [ ~hub ]
        steps:
            - set: meta set foo "success"

    b:
        requires: [ ~hub ]
        steps:
            - set: meta set foo "error"

    virtual:
        requires: [ ~a ]
        annotations:
            screwdriver.cd/virtualJob: true

    target:
        requires: [ ~virtual ]
        blockedBy: [ ~b ]
        steps:
            - print: meta get "foo"
            - check_meta: test "success" = `meta get "foo"`
